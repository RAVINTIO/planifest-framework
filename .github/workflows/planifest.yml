name: Planifest Strict Pipeline

on:
  pull_request:
    branches: [ main, master ]

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Code/Doc Parity
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          COMMIT_MESSAGES=$(git log origin/${{ github.base_ref }}...HEAD --format="%s")

          # Fast Path exemption: if all commits are fix(fast-path): only require component.yml or changelog
          FAST_PATH_COUNT=$(echo "$COMMIT_MESSAGES" | grep -cE "^fix\(fast-path\):" || true)
          TOTAL_COUNT=$(echo "$COMMIT_MESSAGES" | grep -c "." || true)

          if [ "$FAST_PATH_COUNT" -gt 0 ] && [ "$FAST_PATH_COUNT" -eq "$TOTAL_COUNT" ]; then
            if echo "$CHANGED_FILES" | grep -q "^src/"; then
              if ! echo "$CHANGED_FILES" | grep -qE "(component\.yml|plan/changelog/)"; then
                echo "::error title=Planifest Fast Path Violation::Fast Path commits must update component.yml or plan/changelog/."
                exit 1
              fi
            fi
            echo "✅ Planifest fast-path pipeline passed."
            exit 0
          fi

          # Standard check. This is a presence check, not a correspondence
          # guarantee: it confirms a file under plan/, docs/, or a
          # component.yml also changed in this diff — it does not verify
          # that file's content actually corresponds to the src/ change.
          if echo "$CHANGED_FILES" | grep -q "^src/"; then
            if ! echo "$CHANGED_FILES" | grep -qE "^(plan/|docs/|.*component\.yml)"; then
              echo "::error title=Planifest Strict Violation::Code under src/ changed with no plan/, docs/, or component.yml file also touched in this diff. This checks presence only — it does not verify that content corresponds to your change."
              exit 1
            fi
          fi
          echo "✅ Planifest pipeline passed."

  # This job is specific to this repository's own self-description and is
  # deliberately NOT mirrored into planifest-framework/hooks/planifest.yml
  # (the copy setup.sh ships to consumer repos) — a consuming repo's README
  # doesn't have this repository's "## Repository structure" / "## The
  # framework" sections to validate against. See ADR-001 (feature 0000019).
  self-description-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify README matches repository structure
        run: node planifest-framework/scripts/self-description-check.mjs .

  # The test-suite and setup-powershell jobs test this repository's own
  # framework and are deliberately NOT mirrored into
  # planifest-framework/hooks/planifest.yml (the copy setup.sh ships to
  # consumer repos). Consumers don't change the framework, so these tests
  # tell them nothing new. See ADR-002 (feature 0000031).
  test-suite:
    name: Test suite (${{ matrix.os }}${{ matrix.shard && format(', shard {0} of 7', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # The Git Bash leg ran past 10 minutes, so Windows gets 20 minutes per shard
    # and runs seven shards. Seven keeps the four slowest setup suites in
    # separate shards. See ADR-014 (feature 0000037).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 10 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            shard: 1
          - os: windows-latest
            shard: 2
          - os: windows-latest
            shard: 3
          - os: windows-latest
            shard: 4
          - os: windows-latest
            shard: 5
          - os: windows-latest
            shard: 6
          - os: windows-latest
            shard: 7
    steps:
      - uses: actions/checkout@v4

      - name: Run the framework test suite
        shell: bash
        env:
          PLANIFEST_SHARD_INDEX: ${{ matrix.shard }}
          PLANIFEST_SHARD_COUNT: ${{ matrix.shard && 7 || '' }}
        run: bash planifest-framework/tests/run-tests.sh

  setup-powershell:
    name: Setup under PowerShell 7 (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the PowerShell version
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            Write-Error "PowerShell 7 or later is required."
            exit 1
          }

      - name: Run test_setup.ps1
        shell: pwsh
        run: ./planifest-framework/tests/test_setup.ps1

  # This job is repository-only and deliberately NOT mirrored into
  # planifest-framework/hooks/planifest.yml. It runs test_setup.ps1 under
  # Windows PowerShell 5.1, the default shell on a stock Windows machine.
  # See ADR-012 (feature 0000037), which amends ADR-001 (feature 0000031).
  setup-powershell-51:
    name: Setup under Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the PowerShell version
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            Write-Error "Windows PowerShell 5 is required."
            exit 1
          }

      - name: Run test_setup.ps1
        shell: powershell
        run: ./planifest-framework/tests/test_setup.ps1
