# Planifest Component Manifest
id: "setup-hook-integration"
name: "Setup Hook Integration"
feature: "0000030-context-mode-and-telemetry-mcp-removal"
version: "0.6.0"
status: "active"
type: "component-pack"
domain: "developer-tooling"
summary: "setup.sh/ps1 and supporting scripts that install enforcement hooks, commit standards, and external skill management into any Planifest-managed project."
systemContext: "Core setup infrastructure. Runs once per tool target and on re-runs. Installs hooks to .claude/hooks/, wires settings.json, registers the blocking commit-msg hook, writes Tier 1 adapter hook registrations for Cursor/Windsurf/Cline, and syncs external skills via skill-sync.sh."

responsibilities:
  - "Make installed hook scripts executable (chmod +x) on Unix"
  - "Write PreToolUse hook entries into .claude/settings.json using additive merge"
  - "Relocate cline.sh/cline.ps1's boot file into .clinerules/00-planifest-boot.md so it no longer collides with the .clinerules/skills directory (0000027-req-002)"

exceptions:
  - "Must NOT replace the entire settings.json — only merge hook entries additively"
  - "Must NOT wire hooks for non-Claude Code tools in this feature"

stack:
  language: "bash"
  runtime: "bash"
  framework: "none"
  frontend: "none"
  styling: "none"
  componentLibrary: "none"
  database: "none"
  orm: "none"
  testing: "bash"
  iac: "none"
  cloud: "none"
  compute: "none"
  ci: "github-actions"

contract:
  apiSpec: "none"
  inputs:
    - name: "tool name and setup flags"
      type: "cli-argument"
      description: "Arguments passed to setup.sh or setup.ps1 that select the target tool and optional features"
  outputs:
    - name: ".claude/hooks/enforcement/"
      type: "filesystem"
      description: "Directory containing installed enforcement hook scripts"
    - name: ".claude/settings.json (hooks section)"
      type: "filesystem"
      description: "PreToolUse hook entries added to the Claude Code settings file"
  consumedBy: []
  consumes: []
  breakingChangePolicy: "requires-human-approval"

data:
  ownsData: true
  dataContract: "src/setup-hook-integration/docs/data-contract.md"
  tables: [".claude/.planifest-setup-flags"]
  schemaVersion: "1.0.0"
  migrationPath: "src/setup-hook-integration/docs/data-contract.md#migration-history"

scope:
  inScope:
    - "setup.sh and setup.ps1 hook installation and settings.json merge"
    - "setup/claude-code.sh and setup/claude-code.ps1 hook path declarations"
    - "Claude Code only"
    - "setup.sh/setup.ps1 write .claude/.planifest-setup-flags at install time, in parity (0000020-setup-refresh-skill, REQ-008)"
    - "cline.sh/cline.ps1 boot-file/skills-dir path collision fix (0000027-req-002)"
  outOfScope:
    - "Hook wiring for Cursor, Windsurf, Cline, Antigravity"
    - "Hook uninstall / removal logic"
    - "General setup.sh/setup.ps1 parity fixes unrelated to the flags-used marker (0000020-setup-refresh-skill)"
  deferred:
    - "Hook wiring for other tools pending hook architecture confirmation"

risk:
  level: "medium"
  items:
    - "settings.json merge may overwrite existing hooks if not implemented carefully (R-005)"
    - "Bash shebang on Windows — chmod/path handling differs (R-004)"
    - "settings.json hook schema assumption may be wrong (R-002)"
    - "setup.sh/setup.ps1 marker-write addition could drift out of parity between the two scripts (0000020-setup-refresh-skill, R-003)"

quality:
  testCoverage:
    unit: 0
    integration: 52
    e2e: 0
  techDebt:
    - "setup.ps1 ConvertTo-Json depth: PowerShell default depth is 2; using -Depth 10 workaround. If settings.json nesting exceeds depth 10, content will be truncated to string."
  quirks:
    - "setup.ps1 hook entries use forward-slash paths in command values — this matches Claude Code hook config expectations even on Windows"
    - "Write-SetupFlagsMarker (0000020) verified statically only in this environment, no pwsh available (Q-006)"
    - "OpenCode's setup.ps1 tool config lacks a SkillsDir property, marker write silently skips for OpenCode on Windows, pre-existing gap (Q-007)"
    - "cline.ps1's boot-file relocation (0000027-req-002) verified statically only, no pwsh available in this environment, same constraint as Q-006"

