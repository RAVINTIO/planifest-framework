# product.yml — product-level version manifest (ADR-002, feature 0000016)
#
# Created at 0000023-framework-pipeline-fixes P9, per the ship-agent's P9
# Step 9 case 3.
#
# components[] revised 2026-08-08: holds {id, path} pointers to each
# component's own component.yml, not a cached version — versions are read
# live at derivation time (node planifest-framework/scripts/product-version.mjs),
# so this list
# only needs editing when a component is added or removed, never on a
# version bump. See docs/decisions-index.md's Feature 0000016 ADR-002 entry.

id: "planifest-framework"
name: "Planifest Framework"
version: "0.30.0"
feature: "0000031-ci-test-and-powershell-coverage"

versionPolicy: "max-component-version"

components:
  - id: "planifest-framework"
    path: "planifest-framework/component.yml"
  - id: "setup-hook-integration"
    path: "src/setup-hook-integration/component.yml"
