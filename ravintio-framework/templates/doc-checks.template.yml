# doc-checks.yml: the post-P6 doc-check command (ADR-012, feature 0000033)
#
# COPY THIS FILE to ravintio-overrides/doc-checks.yml to declare a smaller
# doc-check command. The framework never creates ravintio-overrides/doc-checks.yml.
# ravintio-overrides/ is owned by the product's human on the loop. The
# framework and its agents only read it.
#
# This file is optional. If it's absent, P6 reruns the full P4 check set
# (validate-agent ## Process steps 0 to 5) after the P6 commit.
# See ravintio-framework/skills/ravintio-docs-agent/SKILL.md (## Post-P6 revalidation).
#
# command: one shell command line, at most 500 characters, with no newline.
# If the key is missing or the value is invalid, P6 runs the full P4 check set
# and logs why in the P6 build-log block.

command: npm run test:docs
