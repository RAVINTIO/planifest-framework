id: "ravintio-framework"
name: "RAVINTIO Framework"
feature: "0000039-ravintio-rebrand"
version: "0.37.0"
status: "active"
type: "component-pack"
domain: "developer-tooling"
summary: "Core standards, skills, hooks, and setup scripts that enforce the RAVINTIO confirmed-design pipeline."
systemContext: "Installed into any AI-assisted project via setup.ps1/setup.sh. A repo on 0.36.0 or earlier first runs migrate-0.37.0-ravintio-rename. Provides enforcement hooks, structured standards, and agent skills consumed by Claude Code, Cursor, Windsurf, and GitHub Copilot."

responsibilities:
  - "Enforce confirmed-design gate: block writes outside declared component scope"
  - "Inject active scope context on every agent turn via check-design hook"
  - "Declare preferred and avoided libraries per language via library-standards docs"
  - "Provide formatting standards: date format (DD MMM YYYY), locale (British English), verbosity"
  - "Supply migration files for propagating standards changes across existing repos"
  - "Register and sync capability skills from ravintio-overrides/"
  - "Maintain build log throughout pipeline run for P8 build assessment"
  - "Direct model tier selection (primary vs cheaper) for all spawned subagents"
  - "Enforce parallelism directives across all phase skills"
  - "Declare build target tier (local/docker/ci-only) in feature brief and design; enforce per-tier agent behaviour in codegen and validate phases"
  - "Provide language quirks reference (language-quirks-en-gb.md) for British English with documented American exceptions"
  - "Track installed skill directories via .ravintio-manifest for safe re-runs"
  - "Present one-at-a-time skill optimisation suggestions via ravintio-optimise-agent (never modifies files)"
  - "Detect and recommend adoption mode at P0 (Greenfield, Standard Iterative, Retrofit, External Anchor)"
  - "Suggest and confirm version number at P0 based on pipeline track"
  - "Run Scope Lock Challenge before design confirmation to surface happy/sad/bad path gaps"
  - "Enforce one-question-at-a-time across all phase skills"
  - "Maintain docs/about.md for project version tracking (read at P0, written at P7)"
  - "Delete plan/.run-mode at P9 so next P0 always asks run-mode fresh. Since 0000032-ADR-002 the P9 marker step deletes and commits all three session markers after P8 and before the Step 9 tag"
  - "Detect stale plan/.run-mode at P0 fresh start and auto-clear with visible warning"
  - "Detect an interrupted close-out on resume (empty plan/current/ + .orchestrator-active present, or a sentinel gone from disk but still committed) and resume at P8 or the P9 marker step from archive evidence, never starting fresh (0000032-ADR-002, supersedes 0000015-ADR-001)"
  - "End P9 with a blocking context clear that refuses new work in the same session, and route every handover-note next step through a track (0000032-ADR-003, supersedes 0000015-ADR-002)"
  - "Enforce build log phase block at every phase P0–P9 before doing phase work"
  - "Provide plan/backlog/ convention for deferred work with P0 pickup protocol"
  - "Derive product-level release version from product.yml per versionPolicy at P9"
  - "Commit after every meaningful artifact write, not only at phase gates, per the commit-cadence rule (orchestrator Hard Limit 7)"
  - "Provide canonical loop mechanics (state, run log, stop rules, toggles) via ravintio-loop-runner"
  - "Run REJECT-default fresh-context verifiers: design-critic, reversal-assessor, cross-model review gate (pre-P7)"
  - "Govern P0-P6 phase reversals: defect report, assessor verdict, scoped correction, 2/feature budget"
  - "Block silent weakening of acceptance criteria/scope during loops via ratchet-check hook"
  - "Verify acceptance criteria by executing the software at P4 via ravintio-verify-by-execution"
  - "Refresh an existing install without manual flag reverse-engineering via ravintio-refresh-setup (standalone skill)"
  - "Record the flags used at install time in a per-tool marker file (.ravintio-setup-flags) at the end of setup.sh/setup.ps1"
  - "Maintain a populated tests/regression/ pack as the safety net for cross-cutting skill/standards/template changes, gated by human review of the promoted test list before any baseline run"
  - "Bound skill-content growth via a recorded audit-findings-report + dual-guardrail trim process (no enforcement-content loss, no ambiguity regression), never applied without a pre-recorded regression-pack baseline to compare against"
  - "Restate every orchestrator rule in exactly one canonical file (phase skill, workflow, standard, or template) with a pointer from the orchestrator, verified by a P4 diff review as the second detector alongside content-pinning regression tests"
  - "Prompt the human on the loop for a declared product id at P0 when product.yml/id is absent, hard-stopping rather than proceeding silently"
  - "Omit AI-attribution footer from ship-agent PR output by default, restorable only via a ravintio-overrides/instructions/ opt-in"
  - "Stage plan/current/ explicitly in the P7 archive commit's git add, not reliant on git's rename-detection heuristic"
  - "Route docs-agent's recommendations.md Deferred Items/Tech Debt rows into plan/backlog/ entries tagged by source, going forward"
  - "Check continuous_run/plan/.run-mode before docs-agent's Gate B stops for confirmation"
  - "Default the Scope Lock Challenge to always-drafted, batch-presented answers via parallel ravintio-scope-lock-agent dispatch, scoped narrowly against 0000014-ADR-008's one-question-at-a-time convention"
  - "Instruct dispatched subagents to file out-of-scope discoveries directly to plan/backlog/ per templates/backlog-entry.template.md, with the dispatching agent pre-computing the next backlog ID, rather than reaching for a host-tool mechanism like spawn_task (0000027-req-003)"
  - "Surface a ravintio-framework/ dependency update at P0 as a decision distinct from ordinary feature-brief coaching (Resume Detection step 1a), requiring human confirmation of both the update and its provenance, documented in standards/framework-update-policy.md (0000027-req-005, ADR-002)"
  - "One-time backfill of the 7 Deferred Items/Tech Debt rows found across 4 pre-0000025 archived features' recommendations.md into tagged plan/backlog/ entries, never modifying the source files (0000027-req-006)"
  - "Record an ADR for the skill-scope-principle test (does this skill provide governance or traceability the host tool cannot) with ravintio-test-writer/implementer/refactor/verify-by-execution as worked examples (0000027-req-007)"
  - "Name a minimal default Phase 1 artifact set (execution plan, requirements, scope, risk register, domain glossary) with explicit trigger conditions for OpenAPI/cost model/SLO definitions/operational model, reflected consistently in feature-pipeline.md and ravintio-spec-agent, with the default artifact count stated in the README (0000027-req-008)"
  - "Reject U+2014 in RAVINTIO prose at write time via the em-dash-guard.mjs PreToolUse(Write, Edit) hook, scoped to plan/current/, docs/, and ravintio-framework/ skills, templates and standards, bypassed only by a visible in-content sentinel comment (0000028-req-006, ADR-003)"
  - "Rewire one caller at a time when self-modifying installed hooks: commit the shared module first, re-run setup.sh for that edit alone, then assert a real side effect rather than an exit code before the next rewire (0000028-ADR-004)"
  - "Wire every hooks/enforcement/ entry into settings.json through a node interpreter prefix rather than a bare .mjs path, so the enforcement layer cannot fail open at exit 126 on a non-executable file mode (0000028-P5 SEC-001)"
  - "Always overwrite the boot file (CLAUDE.md/AGENTS.md) from the current template on every setup.sh/setup.ps1 run, since durable local customization lives in ravintio-overrides/instructions/ and is re-applied every run (0000029-req-001)"
  - "Keep templates/standard-boot.md free of any reference to a specific third-party MCP plugin by name; a boot template must not instruct the agent to prefer a plugin that may not be installed, trusted, or reviewed (0000029-req-002)"
  - "Run an autonomous mode (plan/.run-mode value autonomous) that stops only on a declared exception list, runs every gate as a loop with a fresh-context checker, and ends P9 with one final report. Standing rules live in standards/autonomous-run-standards.md and templates/exception-list.template.yml (0000033)"
  - "Limit P0 to real forks via standards/p0-question-policy.md, sample existing records in discovery, and size releases in points via standards/release-sizing.md and templates/release-budget.template.yml (0000033)"
  - "Admit a change with no src/ target to Fast Path, and rerun the P4 check set after P6 with an optional templates/doc-checks.template.yml (0000033)"
  - "Run independent requirements as parallel streams (templates/stream-state.template.md, parallel_streams toggle) with the orchestrator owning joins, checked by scripts/stream-reconcile.mjs (0000033)"
  - "Archive plan/current/ at P7 with scripts/archive-current.mjs (no glob delete) and print the effective run mode with scripts/run-mode.mjs (0000033)"
  - "Poll the PR's checks at P9 Step 10c, reuse an open draft PR, and in autonomous fix a red check up to 3 times before an exception item (0000037-ADR-002)"
  - "Scan for credentials with scripts/credential-scan.mjs before every autonomous commit (scan-then-commit, held-back files) and scan PR text from files before gh pr create (0000037-ADR-003, ADR-004)"
  - "Read the last merged PR's checks in GUTD step 5, read-only (0000037-ADR-005)"
  - "Run post-P6 revalidation after the P6 commit, capped at 3 cycles in autonomous (0000037-ADR-006)"
  - "Require a Verified by field on each acceptance criterion and run a requirement-ID scan at P3 (0000037-ADR-007, ADR-008)"
  - "Test the installed hook commands verbatim, compare the re-run-setup migration with the release diff, and lint tests for GNU and BSD differences (0000037-ADR-009, ADR-010, ADR-011)"
  - "Run the suite on Windows under Git Bash in seven shards with a fix-or-skip rule, and test setup.ps1 under Windows PowerShell 5.1 (0000037-ADR-012, ADR-013, ADR-014)"
  - "Name the product RAVINTIO Framework in every live path, identifier, variable, marker, and prose line: the pack folder ravintio-framework/, ravintio-overrides/, the ravintio-* skills, RAVINTIO_* variables, and the [RAVINTIO] log prefix (0000039-ADR-002)"
  - "Move a 0.36.0 consumer repo to the RAVINTIO pack with migration migrate-0.37.0-ravintio-rename and its .sh and .ps1 helpers, which back up the old pack to .ravintio-backup/ and never delete it. Setup stops while the old pack or old overrides folder exists (0000039-ADR-005, ADR-006)"
  - "Keep the old-name reads listed in 0000039-ADR-004 through 0.x, removed at 1.0.0: the old session ID variable in the OpenCode adapter, and the old boot-file markers and ignore-file headers. Setup reads neither old setup marker file and stops while one exists, because the migration helper renames both (0000039-ADR-003, ADR-004)"
  - "Fail a test when a tracked live file brings back the old name, with a path-and-line allowlist whose stale entries also fail, while history under plan/_archive/, plan/changelog/, and plan/_migrations/ stays as written (0000039-ADR-007, ADR-009)"
  - "Own the consumer marker files .ravintio-session, .ravintio-manifest, and .ravintio-setup-flags, which consumer repos read and never write (0000039-ADR-010)"

exceptions:
  - "Does not write to ravintio-overrides/ — that directory is user-owned"
  - "Does not store or transmit credentials"
  - "Does not modify application source code directly"

stack:
  language: "javascript"
  runtime: "node"
  framework: "none"
  frontend: "none"
  styling: "none"
  componentLibrary: "none"
  database: "none"
  orm: "none"
  testing: "bash (bespoke test harness)"
  iac: "none"
  cloud: "none"
  compute: "none"
  ci: "github-actions"

contract:
  inputs:
    - name: "stdin (hook payload)"
      type: "event"
      description: "JSON hook payload from Claude Code / Copilot / Cursor lifecycle events"
  outputs:
    - name: "stdout (additionalContext or block message)"
      type: "event"
      description: "Gate-write block message or check-design scope injection"
    - name: "credential-scan.mjs exit code and stdout (0000037)"
      type: "cli"
      description: "Exit 0 clean, 1 match, 2 could not run. Prints path:line and rule name, never matched text. --safe-paths writes the clean paths to a NUL-separated file."
    - name: "migrate-0.37.0-ravintio-rename.sh and .ps1 exit code and stdout (0000039)"
      type: "cli"
      description: "Run from the consumer project root. Exit 0 on success or when nothing is left to do, non-zero on a stop. A stop names the step and the files already moved. Moves the old overrides folder to ravintio-overrides/, renames the workflow to ravintio.yml, removes the old session marker, and moves the old pack into .ravintio-backup/. Deletes no pack file and refuses links and junctions."
    - name: "setup.sh and setup.ps1 stop message (0000039)"
      type: "cli"
      description: "While the old pack folder or the old overrides folder exists, setup exits 1 and names migrate-0.37.0-ravintio-rename."
  consumedBy: ["claude-code-hooks", "copilot-agent-hooks"]
  consumes: []
  breakingChangePolicy: "requires-adr"

data:
  ownsData: false
  tables: []
  schemaVersion: "0.0.0"
  migrationPath: "ravintio-framework/migrations/"

scope:
  inScope:
    - "Library standards docs for TypeScript, Python, Go, Java, databases"
    - "Formatting standards: date format, locale, verbosity"
    - "gate-write and check-design enforcement hooks"
    - "GitHub Copilot adapter"
    - "Orchestrator sentinel enforcement"
    - "Capability skill intake via ravintio-overrides/capability-skills/"
    - "Migration infrastructure for standards propagation"
    - "setup.ps1 / setup.sh for tool registration"
    - "P8 Build Assessment phase and ravintio-build-assessment-agent skill"
    - "build-log.template.md and build log maintenance across pipeline phases"
    - "Model tier decision table and parallelism directives in all phase skills"
    - "Build target field in feature-brief and design templates"
    - "ravintio-optimise-agent skill for interactive skill file review"
    - "design.template.md extracted from orchestrator inline block"
    - "setup.sh/.ps1 .ravintio-manifest tracking for idempotent re-runs"
    - "plan/backlog/ entries, product.yml template, loop-state/run-log/defect-report/revision-log templates"
    - "ratchet-check.mjs enforcement hook, consistency-check.mjs and product-version.mjs scripts"
    - "ravintio-loop-runner, ravintio-design-critic, ravintio-reversal-assessor, ravintio-verify-by-execution skills"
    - "tests/regression/ population and baseline-vs-post-trim comparison for skill/standards/template content edits"
    - "standards/agent-dispatch-standards.md as the canonical home for model-tier decisions and parallelism/dispatch mechanics, referenced (not restated) by the orchestrator, ship-agent, and codegen-agent"
    - "agent-dispatch-standards.md's Agent Dispatch Template: out-of-scope-discovery filing clause (0000027-req-003)"
    - "standards/framework-update-policy.md and orchestrator Resume Detection step 1a (0000027-req-005)"
    - "Historical plan/backlog/ backfill for pre-0000025 recommendations.md content (0000027-req-006)"
    - "Skill-scope-principle ADR (0000027-req-007)"
    - "Minimal Phase 1 artifact set definition in feature-pipeline.md, ravintio-spec-agent, and README (0000027-req-008)"
    - "hooks/enforcement/em-dash-guard.mjs and its setup.sh/setup.ps1 PreToolUse registration (0000028-req-006)"
    - "node interpreter prefix on every enforcement hook command string written into settings.json by setup.sh (0000028-P5 SEC-001)"
    - "write_boot_file/Write-BootFile always-overwrite behaviour, replacing the prior skip-if-exists guard (0000029-req-001)"
    - "templates/standard-boot.md free of any named third-party MCP plugin reference (0000029-req-002)"
    - "scripts/archive-current.mjs, scripts/stream-reconcile.mjs, and scripts/run-mode.mjs (0000033)"
    - "standards/autonomous-run-standards.md, standards/p0-question-policy.md, standards/release-sizing.md, and the autonomous-run additions to standards/agent-dispatch-standards.md (0000033)"
    - "templates/exception-list.template.yml, release-budget.template.yml, doc-checks.template.yml, and stream-state.template.md (0000033)"
    - "scripts/credential-scan.mjs, the Pre-commit credential scan section of standards/autonomous-run-standards.md, and ship-agent Step 10 and Step 10c (0000037)"
    - "Verified by field in templates/requirement.template.md, the P3 requirement-ID scan in ravintio-codegen-agent, and the Type column of the P4 coverage table (0000037)"
    - "GUTD step 5 in ravintio-overrides/instructions/custom-003-git-up-to-date-shorthand.md and the revised post-P6 revalidation in ravintio-docs-agent (0000037)"
    - "tests/run-tests.sh shard selection through RAVINTIO_SHARD_INDEX and RAVINTIO_SHARD_COUNT, the portability lint, and the Windows skip table in tests/README.md (0000037)"
    - ".github/workflows/ravintio.yml Windows Git Bash shards and setup-powershell-51 job, repository-only (0000037)"
    - "The rename to ravintio-framework/, ravintio-overrides/, ravintio-* skills, RAVINTIO_* variables, and the [RAVINTIO] log prefix, applied in one scripted pass (0000039-ADR-002, ADR-008)"
    - "migrations/migrate-0.37.0-ravintio-rename.md with its .sh and .ps1 helpers, and the setup stop while the old pack or overrides folder exists (0000039-ADR-005, ADR-006)"
    - "Old-name reads through 0.x, removed at 1.0.0: the old session ID variable, and old boot-file markers and ignore-file headers (0000039-ADR-003, ADR-004)"
    - "The setup stop while a tool folder holds the old setup flags or manifest file, and the helper step that renames both in eight tool folders and rewrites the manifest entries (0000039-ADR-004, ADR-005)"
    - "The brand guard suite tests/test-0000039-req-007-brand-guard.sh with its path-and-line allowlist, and the other 0000039 suites test-0000039-req-001 to req-010 (0000039-ADR-007)"
    - "Version 0.37.0 in product.yml, this manifest, and docs/about.md (0000039-ADR-003)"
  outOfScope:
    - "Application-level code generation (handled by ravintio-codegen-agent)"
    - "CI pipeline configuration for consumer projects"
  deferred:
    - "Windsurf native hook wiring (hooks API not yet stable)"
    - "Roo-Code support (tool sunset 02 May 2026)"
    - "The old-name reads, removed at 1.0.0"
    - "gh repo rename ravintio-framework and the origin update, run by the human on the loop after the merge"

risk:
  level: "low"
  items:
    - "Path translation on Windows/Git Bash requires cygpath guards in tests"
    - "Aggressive skill/instruction trimming can leave technically-complete but ambiguous wording that increases future agent confusion or retries even without losing enforcement content — mitigated by the regression-pack baseline comparison introduced in 0000021"
    - "Only 4 of 22 regression tests pin orchestrator-specific content; a lost rule in an untested area would not fail the pack — mitigated by the P4 diff review named as a second detector in 0000022, resolving identically to a failed test (restore, never rationalise)"
    - "credential-scan.mjs detects and reports only. The stop on a match is skill text that an agent follows, not a hook, and without gitleaks the scan uses the regex rules alone (0000037-ADR-003)"
    - "Old-name reads stay in live code through 0.x and are removed at 1.0.0. A consumer that skips the 0.x window loses them, and the brand guard allowlist drops each entry when they go (0000039-ADR-004)"
    - "The consumer migration moves files in a consumer repo. It refuses links and junctions, backs up the old pack and deletes nothing, and a clash stops it before the first move (0000039-ADR-005)"
    - "Windows Git Bash skips some checks (symlinks, NTFS modes, cwd deletion), tracked in backlog 0000208, 0000210, 0000211, and 0000209 records a real enforcement gap on Windows (0000037)"
    - "The em dash guard's bypass sentinel is matched anywhere in the payload, including inside prose that merely quotes it, so any document explaining the rule exempts itself from the rule (0000028-P5 SEC-005)"

quality:
  testCoverage:
    unit: 0
    integration: 613
    e2e: 0
  techDebt: []
  quirks:
    - "gate-write component path matching is prefix-based; very short prefixes may over-permit"
    - "ratchet-check treats a reworded criterion as remove+add and blocks it (conservative); the .ratchet-approve marker is the intended path for legitimate rewording"
    - "ratchet-check cannot verify who wrote .ratchet-approve (ADR-004 same-changeset detection not implemented in 0.16.0); marker forgery is audit-detected via ratchet-log.md and P8, not prevented"
    - "product-version.mjs parses only the constrained product.template.yml shape, not arbitrary YAML"
    - "The brand guard reads git ls-files minus the history paths and plan/current/, so an untracked file with the old name passes until it is added. Each allowlist entry needs a path regex, a line regex, and a reason (0000039-ADR-007)"
    - "The migration helpers rename the old setup flags and manifest files in place, and drop any manifest entry whose name fails the strict allowlist, with a warning. A hand-run helper leaves .ravintio-backup/, so the migrator records applied and not not-applicable (0000039-ADR-006)"
    - "The em dash guard only matches the Write and Edit tools and only inspects paths that resolve under 5 relative prefixes, so a write made through Bash, or through an absolute path outside cwd, is not inspected at all. This is a style rule with a deliberately narrow reach, not an authorisation control (0000028-req-006)"

pipeline:
  templateVersion: "1.0.0"
  featureMode: "retrofit"
  domainKnowledgePath: "plan/current"

